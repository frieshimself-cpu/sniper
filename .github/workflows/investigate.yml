# The agent, online, with no server: once an hour GitHub runs a cycle.
#   ballot of fresh launches -> poll on X for X_POLL_MINUTES -> winner investigated -> case posted and committed.
# Secrets: HELIUS_API_KEY (required), ARKHAM_API_KEY, XAI_API_KEY, X_BEARER_TOKEN, TURSO_DATABASE_URL + TURSO_AUTH_TOKEN (or KV_*),
#   and either X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN,
#   X_ACCESS_SECRET (OAuth 1.0a) or X_CLIENT_ID, X_CLIENT_SECRET, X_USER_TOKEN, X_REFRESH_TOKEN (OAuth 2.0, needs a shared store),
# X_ACCESS_SECRET (polls on X), KV_REST_API_URL + KV_REST_API_TOKEN (shared state with the Vercel site).
name: investigate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      subject:
        description: "Mint to investigate now, skipping the ballot (blank = run a full cycle)"
        required: false
        default: ""
      dry:
        description: "Dry run: print, commit nothing"
        type: boolean
        default: false

concurrency:
  group: investigate
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Cycle
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_USER_TOKEN: ${{ secrets.X_USER_TOKEN }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://frieshimself-cpu.github.io/sniper' }}
          X_POLL_MINUTES: ${{ vars.X_POLL_MINUTES || '10' }}
          REQUIRE_VOTES: ${{ vars.REQUIRE_VOTES || 'on' }}
          MIN_PUBLISH_SCORE: ${{ vars.MIN_PUBLISH_SCORE || '35' }}
          CRIME_STATE_DIR: web/.data
        run: |
          if [ -n "${{ inputs.subject }}" ]; then
            ARGS="--subject ${{ inputs.subject }}"
            if [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
            npm run investigate -- $ARGS
          elif [ "${{ inputs.dry }}" = "true" ]; then
            npm run cycle -- --dry
          else
            npm run cycle
          fi

      - name: Commit the case
        if: ${{ inputs.dry != true }}
        run: |
          git config user.name "C.R.I.M.E."
          git config user.email "crime@users.noreply.github.com"
          git add data/cases.json data/status.json data/watchlist.json fixtures/registry.json out/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            MSG=$(node -e 'console.log(require("./data/status.json").message)')
            if git diff --cached --quiet -- data/cases.json; then
              git commit -m "Status: ${MSG}"
            else
              N=$(node -e 'const f=require("./data/cases.json");const c=f.cases.at(-1);console.log(c?`${c.id} ${c.kind==="person"?c.subjects[0]:"$"+c.token.symbol}`:"")')
              git commit -m "Case ${N}: opened by the agent" -m "${MSG}"
            fi
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
            gh workflow run pages.yml --ref "${{ github.ref_name }}" || echo "pages workflow not dispatched (is Pages enabled?)"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
